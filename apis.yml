aid: credentially
name: Credentially
description: >-
  Credentially is a UK-founded, healthcare-only onboarding and compliance automation platform used by
  NHS trusts, private providers, urgent care and clinical staffing agencies in the UK and US. It brings
  pre-employment checks, DBS and right-to-work validation, primary source verification, credentialing
  and continuous compliance monitoring onto one platform, cutting the platform-managed steps of onboarding
  clinical staff from an industry average of around 60 days to as little as 5. The Credentially Public API
  (OpenAPI 3.1) exposes profiles, placements, documents with OCR auto-fill, DBS checks, references,
  right-to-work status and compliance packages, with a companion Webhook API for state-change events.
